<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas Room · 协作白板</title><style>
:root{--ink:#17212b;--muted:#6d7b88;--line:#dbe2e8;--bg:#f5f8fa;--blue:#276ef1;--yellow:#fff3bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.app{max-width:1450px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:20px;margin-bottom:14px}.logo{font-size:20px;font-weight:800;display:flex;gap:10px;align-items:center}.dot{width:32px;height:32px;background:#276ef1;border-radius:9px;color:white;display:grid;place-items:center}.room{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted)}.room b{color:var(--ink)}.top .actions{margin-left:auto;display:flex;gap:8px}button{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 12px;border-radius:7px;cursor:pointer}button:hover{border-color:var(--blue);color:var(--blue)}.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}.layout{display:grid;grid-template-columns:215px minmax(500px,1fr) 270px;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 13px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool.active{background:#e9f0ff;color:var(--blue);border-color:#9ebaff}.divider{border-top:1px solid var(--line);margin:18px 0}.color{display:flex;gap:7px;flex-wrap:wrap}.color button{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px var(--line)}.color button.active{box-shadow:0 0 0 2px var(--blue)}.board-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.board-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.board-head small{color:var(--muted)}.board{height:650px;position:relative;overflow:hidden;background-color:#fbfcfd;background-image:radial-gradient(#d7dee6 1px,transparent 1px);background-size:22px 22px;cursor:crosshair}.object{position:absolute;min-width:90px;min-height:40px;cursor:move;user-select:none}.note{background:var(--yellow);padding:14px;border-radius:2px;box-shadow:0 4px 12px #24364a18;transform:rotate(-1deg)}.note.blue{background:#dff3ff}.note.pink{background:#ffe0eb}.label{background:white;border:1px solid var(--line);padding:10px;border-radius:8px;box-shadow:0 3px 10px #24364a14}.shape{width:90px;height:58px;border:3px solid #276ef1;border-radius:12px;background:#e9f0ff}.circle{border-radius:50%;width:70px;height:70px}.line{height:2px!important;min-height:2px!important;background:#667484;transform-origin:left center}.cursor{position:absolute;z-index:8;font-size:11px;pointer-events:none}.cursor i{display:block;width:12px;height:12px;background:#f35353;clip-path:polygon(0 0,100% 60%,62% 68%,55% 100%)}.people{display:flex;gap:6px}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px}.member{display:flex;align-items:center;gap:9px;padding:8px 0}.member small{color:var(--muted)}.filter{display:flex;flex-wrap:wrap;gap:6px}.filter button{font-size:12px;padding:5px 8px}.filter button.active{background:var(--ink);color:#fff}.event{font-size:12px;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;display:none}@media(max-width:1000px){.layout{grid-template-columns:190px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:15px}}@media(max-width:700px){.app{padding:10px}.layout{grid-template-columns:1fr}.left,.right{display:block}.board{height:520px}.top{flex-wrap:wrap}.top .actions{margin-left:0}}
</style></head><body><main class="app"><header class="top"><div class="logo"><div class="dot">C</div>Canvas Room</div><div class="room">房间 <b id="roomId">SPRINT-42</b><button id="copy">复制链接</button></div><div class="actions"><button id="undo">↶ 撤销</button><button id="export" class="primary">导出 PNG</button></div></header><section class="layout"><aside class="panel left"><h3>工具</h3><div class="tools"><button class="tool active" data-type="note">▤ 便签</button><button class="tool" data-type="text">T 文本</button><button class="tool" data-type="rect">□ 矩形</button><button class="tool" data-type="circle">○ 圆形</button><button class="tool" data-type="line">╱ 连线</button><button id="select" class="tool">↖ 选择</button></div><div class="divider"></div><h3>便签颜色</h3><div class="color"><button style="background:#fff3bf" data-c="yellow"></button><button style="background:#dff3ff" data-c="blue"></button><button style="background:#ffe0eb" data-c="pink"></button></div><div class="divider"></div><h3>快捷操作</h3><p style="color:var(--muted);line-height:1.7">点击画布放置元素<br><span class="kbd">Delete</span> 删除选中<br><span class="kbd">⌘ Z</span> 撤销</p></aside><section class="board-wrap"><div class="board-head"><div class="people"><div class="avatar" style="background:#276ef1">你</div><div class="avatar" style="background:#ed6a5a">林</div><div class="avatar" style="background:#44a57b">M</div></div><small>3 位成员正在编辑</small><small id="sync" style="margin-left:auto;color:#44a57b">● 已同步</small></div><div class="board" id="board"><div class="object note" style="left:100px;top:90px" data-cat="yellow">本周目标<br><small>把首页流程走通</small></div><div class="object note blue" style="left:330px;top:180px" data-cat="blue">灵感池<br><small>尝试更轻的导航</small></div><div class="object label" style="left:590px;top:90px">下一步：验证原型</div><div class="object shape" style="left:200px;top:360px"></div><div class="object shape circle" style="left:470px;top:380px"></div><div class="cursor" style="left:52%;top:44%;color:#ed6a5a"><i></i> Lin</div><div class="cursor" style="left:72%;top:20%;color:#44a57b"><i></i> Morgan</div></div></section><aside class="panel right"><h3>活动动态</h3><div class="event"><b>林</b> 移动了「本周目标」<br><small>刚刚</small></div><div class="event"><b>Morgan</b> 添加了一个圆形<br><small>2 分钟前</small></div><div class="event">你创建了这个房间<br><small>今天 09:42</small></div><h3 style="margin-top:23px">筛选便签</h3><div class="filter"><button class="active" data-filter="all">全部</button><button data-filter="yellow">黄色</button><button data-filter="blue">蓝色</button><button data-filter="pink">粉色</button></div><div class="divider"></div><h3>房间成员</h3><div class="member"><div class="avatar" style="background:#276ef1">你</div><div><b>你</b><br><small>主持人 · 在线</small></div></div><div class="member"><div class="avatar" style="background:#ed6a5a">林</div><div><b>林晓</b><br><small>设计师 · 在线</small></div></div><div class="member"><div class="avatar" style="background:#44a57b">M</div><div><b>Morgan</b><br><small>产品 · 在线</small></div></div></aside></section></main><div class="toast" id="toast"></div><script>
let selected=null,tool='note',color='yellow',history=[];const board=document.querySelector('#board'),toast=document.querySelector('#toast');function notify(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}function save(){history.push(board.innerHTML)}document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.type||'select';document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('.color button').forEach(b=>b.onclick=()=>color=b.dataset.c);board.onclick=e=>{if(e.target!==board)return;if(tool==='select')return;save();let o=document.createElement('div');o.className='object '+(tool==='note'?'note '+color:tool==='text'?'label':tool==='rect'?'shape':tool==='circle'?'shape circle':'line');o.style.left=e.offsetX+'px';o.style.top=e.offsetY+'px';if(tool==='note')o.innerHTML='新便签<br><small>双击编辑内容</small>';if(tool==='text')o.textContent='双击编辑文本';if(tool==='line'){o.style.width='140px';o.style.transform='rotate(18deg)'}o.dataset.cat=tool==='note'?color:'';board.append(o);notify('已添加元素')};board.addEventListener('pointerdown',e=>{let o=e.target.closest('.object');if(!o)return;selected=o;let sx=e.clientX,sy=e.clientY,ox=o.offsetLeft,oy=o.offsetTop;function move(v){o.style.left=ox+v.clientX-sx+'px';o.style.top=oy+v.clientY-sy+'px'}function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)}window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)});board.addEventListener('dblclick',e=>{let o=e.target.closest('.object');if(o){let v=prompt('编辑内容',o.innerText);if(v!==null)o.innerText=v}});window.addEventListener('keydown',e=>{if(e.key==='Delete'&&selected){save();selected.remove();selected=null;notify('已删除元素')}});document.querySelector('#undo').onclick=()=>{if(history.length){board.innerHTML=history.pop();notify('已撤销')}};document.querySelector('#copy').onclick=()=>{navigator.clipboard?.writeText(location.href+'?room=SPRINT-42');notify('房间链接已复制')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');let f=b.dataset.filter;board.querySelectorAll('.object.note').forEach(o=>o.style.display=f==='all'||o.dataset.cat===f?'':'none')});document.querySelector('#export').onclick=()=>{notify('演示模式：已生成 PNG 导出快照')};
</script></body></html>
